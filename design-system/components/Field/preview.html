<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field</title>

</head>
<body>
<div style="max-width:420px">
<label class="field"><span>Resolution notes</span><textarea id="ds-notes" rows="2">Verified by one-time code. Unlocked the account; old password was saved in the phone's Mail app.</textarea></label>
<div class="grid2"><label class="field"><span>Category</span><select id="ds-cat"><option>Account / Access</option></select></label><label class="field"><span>Escalate to</span><select id="ds-team"><option>Security</option></select></label></div>
<label class="field"><span>New password</span><input id="ds-pw" type="password" value="Brightline-2026"></label>
<label class="check"><input id="ds-must" type="checkbox" checked> User must change password at next sign-in</label>
<label class="check"><input id="ds-unlock" type="checkbox" checked> Unlock the account</label>
</div>
</body>
</html>

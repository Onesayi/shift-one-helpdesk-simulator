<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CallBar</title>

</head>
<body>
<div class="ds-stack"><div class="callbar live"><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/></svg><b>On the line</b><span class="grow"></span><button class="btn sm">Hold</button><button class="btn sm">Call back later</button><button class="btn sm danger-ghost">End call</button></div>
<div class="callbar hold"><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/></svg><b>On hold</b><span class="muted small">0:31 · hangs up at 0:45</span><span class="grow"></span><button class="btn sm primary">Resume</button></div>
<div class="callbar late"><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/></svg><b>Callback overdue</b><span class="muted small">due 2 min ago</span><span class="grow"></span><button class="btn sm primary">Call back</button></div></div>
</body>
</html>

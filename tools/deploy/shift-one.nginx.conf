# Shift One on a Library of Code Cloud Services container (CSG2).
# There's no shared web root: the site runs on our own port, and Library of Code reverse-proxies
# the custom domain to it (they terminate HTTPS). install-server.sh fills in __PORT__ and __ROOT__.
server {
    # IPv4 only: the reverse proxy reaches the container over IPv4, and some containers have no IPv6.
    listen __PORT__;
    server_name _;

    # `current` is a symlink to the live release, so a deploy is one atomic symlink swap.
    root __ROOT__/current;
    index index.html;
    charset utf-8;

    # Serve files only. Hidden files (.nojekyll, .git if one ever lands) stay private.
    location ~ /\. { deny all; return 404; }
    location / { try_files $uri $uri/ =404; }

    # HTML and the version marker are always revalidated, so a deploy shows up straight away.
    location ~* \.html$ { add_header Cache-Control "no-cache"; }
    location = /version.txt { add_header Cache-Control "no-store"; }
    # CSS, JS and images can be cached for a day. Their names don't change between releases.
    location ~* \.(css|js|png|svg|gif|ico|woff2?)$ { add_header Cache-Control "public, max-age=86400"; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/shift-one.access.log;
    error_log  /var/log/nginx/shift-one.error.log warn;
}

# Security headers for Shift One. Install as /etc/nginx/snippets/shift-one-security.conf and
# `include` it in the server block AND in every location that has its own add_header (nginx drops
# server-level add_header lines inside a location that sets any of its own). See docs/SECURITY.md.
#
# The Content-Security-Policy matches the <meta> tag in index.html and dispatch.html, plus
# frame-ancestors, which only works as a header. If you change one, change the other.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Nobody can put the site in a frame (clickjacking). Older browsers read this one.
add_header X-Frame-Options "DENY" always;
# Browsers use the declared content type and don't guess.
add_header X-Content-Type-Options "nosniff" always;
# Links to other sites get the domain only, never the full path.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The simulator uses none of these browser features.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HTTPS only for a year. TLS ends at the Library of Code gateway, but the browser only ever sees
# HTTPS for *.apps.libraryofcode.dev, so this is safe to send from here. No includeSubDomains:
# we don't own the parent domain.
add_header Strict-Transport-Security "max-age=31536000" always;
